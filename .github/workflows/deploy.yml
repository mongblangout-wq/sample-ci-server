name: Container CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        echo "version=$(date +Y%m%d_%H%M%S)-(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        name: mybuilder

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Multi-Platform Image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/sample-server:${{ steps.version.outputs.version }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        envs: IMAGE_TAG, ECR_REGISTRY
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.version }}
        script: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
          mkdir -p ~/sample-server && cd ~/sample-server
          
          echo "ECR_REGISTRY=$ECR_REGISTRY" > .env
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          
          # 들여쓰기 오류를 방지하기 위해 한 줄씩 직접 echo로 compose.yaml 파일 작성
          echo "version: '3.8'" > compose.yaml
          echo "services:" >> compose.yaml
          echo "  web:" >> compose.yaml
          echo "    image: \${ECR_REGISTRY}/sample-server:\${IMAGE_TAG}" >> compose.yaml
          echo "    ports:" >> compose.yaml
          echo "      - '3000:3000'" >> compose.yaml
          echo "    environment:" >> compose.yaml
          echo "      - DB_HOST=db" >> compose.yaml
          echo "      - DB_USER=root" >> compose.yaml
          echo "      - DB_PASSWORD=secret" >> compose.yaml
          echo "    depends_on:" >> compose.yaml
          echo "      - db" >> compose.yaml
          echo "    networks:" >> compose.yaml
          echo "      - todo-network" >> compose.yaml
          echo "  db:" >> compose.yaml
          echo "    image: mysql:8.0" >> compose.yaml
          echo "    environment:" >> compose.yaml
          echo "      - MYSQL_ROOT_PASSWORD=secret" >> compose.yaml
          echo "      - MYSQL_DATABASE=todo" >> compose.yaml
          echo "    volumes:" >> compose.yaml
          echo "      - db-data:/var/lib/mysql" >> compose.yaml
          echo "    networks:" >> compose.yaml
          echo "      - todo-network" >> compose.yaml
          echo "volumes:" >> compose.yaml
          echo "  db-data:" >> compose.yaml
          echo "networks:" >> compose.yaml
          echo "  todo-network:" >> compose.yaml
          
          docker compose pull
          docker compose up -d
          docker image prune -f