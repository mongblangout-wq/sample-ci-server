name: Deploy to EC2

on:
  push:
    branches: [ master ] # master 브랜치에 push되면 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    # 여기서부터 아까 하신 scp 전송 및 pm2 실행을 자동화하는 코드가 들어갑니다.
    # 안전을 위해 password나 pem 키는 GitHub Secrets에 등록해서 사용합니다.