steps:
      - name: GitHub 레포지토리에서 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 및 빌드 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 의존성 설치 및 빌드 (CI 과정)
        run: |
          npm ci
          npm run build

      - name: 🚀 EC2로 빌드된 파일 전송 (CD 과정 - SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }} # EC2 퍼블릭 IP
          username: ec2-user
          key: ${{ secrets.EC2_PRIVATE_KEY }} # .pem 키 내용
          source: "dist,package.json,tsconfig.json,tsconfig.build.json"
          target: "~/sample-server"

      - name: 🚀 EC2에서 서버 다시 켜기 (CD 과정 - SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/sample-server
            npm install --production
            pm2 restart sample-server || pm2 start dist/main.js --name sample-server